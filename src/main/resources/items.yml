# Logical item keys used by GrowOps.
# 'itemsadder' = the ItemsAdder id (namespace:id). If ItemsAdder is missing or the id does not exist,
# the plugin falls back to 'material' with the name and lore below.
# Change any 'itemsadder' value to point at your own ItemsAdder items.
items:
  pot:
    itemsadder: "growops:pot"
    material: FLOWER_POT
    name: "<green>Grow Pot"
    lore:
      - "<gray>Place it, then plant a seed."
  tent:
    itemsadder: "growops:tent"
    material: GREEN_STAINED_GLASS
    name: "<green>Grow Tent"
    lore:
      - "<gray>Pots nearby grow in optimal conditions."
  waterer:
    itemsadder: "growops:waterer"
    material: CAULDRON
    name: "<aqua>Auto-Waterer"
    lore:
      - "<gray>Waters pots around it."
      - "<gray>Fill it with water buckets."
  processing_table:
    itemsadder: "growops:processing_table"
    material: SMITHING_TABLE
    name: "<gold>Processing Table"
    lore:
      - "<gray>Bag, grind and roll."
  press:
    itemsadder: "growops:press"
    material: STONECUTTER
    name: "<gray>Weed Press"
    lore:
      - "<gray>Presses ground weed into bricks."
  lockup:
    itemsadder: "growops:lockup"
    material: BARREL
    name: "<dark_gray>Secret Lockup"
    lore:
      - "<gray>Sneak + right-click to open."
  watering_can:
    itemsadder: "growops:watering_can"
    material: BUCKET
    name: "<aqua>Watering Can"
    lore:
      - "<gray>Right-click water to refill."
  fertilizer_yield:
    itemsadder: "growops:fertilizer_yield"
    material: BONE_MEAL
    name: "<yellow>Yield Fertilizer"
    lore:
      - "<gray>Apply early. More buds."
  fertilizer_speed:
    itemsadder: "growops:fertilizer_speed"
    material: BONE_MEAL
    name: "<aqua>Speed Fertilizer"
    lore:
      - "<gray>Apply early. Faster growth."
  fertilizer_resist:
    itemsadder: "growops:fertilizer_resist"
    material: BONE_MEAL
    name: "<green>Resist Fertilizer"
    lore:
      - "<gray>Apply early. Fewer pests."
  pesticide:
    itemsadder: "growops:pesticide"
    material: POTION
    name: "<red>Pesticide Spray"
    lore:
      - "<gray>Cures an infestation."
  bud:
    itemsadder: "growops:bud"
    material: GREEN_DYE
    name: "<green>Bud"
  bag_empty:
    itemsadder: "growops:bag_empty"
    material: PAPER
    name: "<white>Empty Bag"
  weed_bag:
